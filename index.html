<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Assignment 2</title>
    <link rel="stylesheet" href="style.css">
    
    </head>


<body>

    <h1>Blockchain Assignment 2</h1>
    
    <div class="mode-buttons">
    <button id="addModeBtn" class="mode-btn active">Add Record</button>
    <button id="searchModeBtn" class="mode-btn">Search Record</button>
</div>
    

    <div id="addSystem">

    <div class="top-panel">

        <div class="card">
            <div class="card-body">Add New Record</div>

            <form id="addRecordForm">
                <label>ItemID: <input type="number" id="ItemID" required></label><br><br>
                <label>ItemQTY: <input type="number" id="ItemQTY" required></label><br><br>
                <label>ItemPrice: <input type="number" id="ItemPrice" required></label><br><br>

                <label>Location:
                    <select id="Location" required>
                        <option value="">-- Select Warehouse --</option>
                        <option value="A">Warehouse A</option>
                        <option value="B">Warehouse B</option>
                        <option value="C">Warehouse C</option>
                        <option value="D">Warehouse D</option>
                    </select>
                </label><br><br>

                <button type="submit">Add Record</button>
            </form>
        </div>

        <div class="card">
            <div class="card-body">Process Log</div>
            <div id="logBox"></div>
        </div>

    </div>

</div>

<!-- MULTI-SIGNATURE QUERY PANEL -->
<div id="searchSystem" style="display:none;">

    <div class="top-panel">

        <div class="card">
            <div class="card-body">Multi-Signature Query</div>

            <label>Item ID:
                <input type="number" id="searchItemID" placeholder="e.g. 002">
            </label>

            <br><br>

            <button id="searchBtn">Run Multi-Signature Verification</button>
        </div>

        <div class="card">
            <div class="card-body">Multi-Signature Log</div>
            <div id="multiSignLog"></div>
        </div>

    </div>

</div>

    <div class="warehouse-box">
    <h1 class="titleA">Warehouse A</h1>
    <table class="warehouse_A">
            <thead>
                <tr>
                    <th>ItemID</th>
                    <th>ItemQTY</th>
                    <th>ItemPrice</th>
                    <th>Location</th> 
                </tr>
            </thead>
            <tbody></tbody>
    </table>
    </div>

    <div class="warehouse-box">
    <h1 class="titleB">Warehouse B</h1>
    <table class="warehouse_B">
            <thead>
                <tr>
                    <th>ItemID</th>
                    <th>ItemQTY</th>
                    <th>ItemPrice</th>
                    <th>Location</th> 
                </tr>
            </thead>
            <tbody></tbody>
    </table>
    </div>

    <div class="warehouse-box">
    <h1 class="titleC">Warehouse C</h1>
    <table class="warehouse_C">
            <thead>
                <tr>
                    <th>ItemID</th>
                    <th>ItemQTY</th>
                    <th>ItemPrice</th>
                    <th>Location</th> 
                </tr>
            </thead>
            <tbody></tbody>
    </table>
    </div>

    <div class="warehouse-box">
    <h1 class="titleD">Warehouse D</h1>
    <table class="warehouse_D">
            <thead>
                <tr>
                    <th>ItemID</th>
                    <th>ItemQTY</th>
                    <th>ItemPrice</th>
                    <th>Location</th> 
                </tr>
            </thead>
            <tbody></tbody>
    </table>
    </div>
    
    <!-- ───────────────────────────── -->
<!-- MULTI-SIGNATURE QUERY PANEL -->
<!-- ───────────────────────────── -->


    <!--
        1. crypto.js first       — defines NODES[], math utils, generateKeyPair
        2. nodeX_parameters.js   — calls generateKeyPair(), pushes into NODES[]
        3. consensus.js          — uses NODES[], handles voting and storage
        4. main.js               — drives the UI workflow
    -->
    <script src="crypto.js"></script>
    <script src="keys/nodeA_parameters.js"></script>
    <script src="keys/nodeB_parameters.js"></script>
    <script src="keys/nodeC_parameters.js"></script>
    <script src="keys/nodeD_parameters.js"></script>
    <script src="consensus.js"></script>
    <script src="multisign.js"></script>
    <script src="main.js"></script>

</body>
</html>
